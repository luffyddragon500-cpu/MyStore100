name: Build MyStore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "MyStore_Luffy40_NativeUI_FIXED.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MyStore_Luffy40_NativeUI_FIXED.zip not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Project files:"
          ls -la extracted

          if [ ! -f "extracted/settings.gradle" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: extracted
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStore-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
